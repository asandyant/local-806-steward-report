<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local 806 Job Steward Weekly Report</title>
<style>
  :root{--ink:#111;--line:#111;--soft:#f3f4f6;--button:#0f172a;--blue:#eaf6ff}
  *{box-sizing:border-box}
  body{margin:0;background:#e5e7eb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  .toolbar{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:12px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
  .toolbar-inner{max-width:1100px;margin:0 auto;display:grid;gap:10px}
  .toolbar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
  .toolbar label{font-size:12px;font-weight:700;display:grid;gap:4px}
  .toolbar input,.toolbar button{height:36px;border:0;border-radius:7px;padding:7px 9px;font-size:14px}
  .toolbar input{min-width:160px}.toolbar button{cursor:pointer;background:#e5e7eb;color:#111827;font-weight:800}
  .toolbar button.primary{background:#38bdf8;color:#082f49}.toolbar button.danger{background:#fecaca;color:#7f1d1d}
  .note{font-size:13px;color:#dbeafe;line-height:1.35}.wrap{padding:22px 12px 42px}
  .sheet{width:8.5in;min-height:11in;margin:0 auto 22px;background:white;padding:.33in .31in .25in;border:1px solid #a3a3a3;box-shadow:0 8px 24px rgba(0,0,0,.17);page-break-after:always}
  .union-title{border:2px solid var(--line);height:.47in;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:20px;letter-spacing:.1px;white-space:nowrap}
  .report-title{border-left:2px solid var(--line);border-right:2px solid var(--line);border-bottom:1px solid var(--line);height:.34in;display:grid;grid-template-columns:1fr 1.7in;align-items:center;font-size:13px}
  .report-title .main{text-align:center;font-weight:900;letter-spacing:.2px}.pageNo{text-align:center;font-size:12px}
  table.form{width:100%;border-collapse:collapse;table-layout:fixed;border-left:2px solid var(--line);border-right:2px solid var(--line)}
  table.form th,table.form td{border:1px solid var(--line);height:.31in;padding:0;vertical-align:middle}
  table.form th{font-size:11px;text-transform:uppercase;font-weight:700;background:#fff;text-align:center}
  .name-col{width:2.45in}.ins-col{width:.72in}.day-col{width:.56in}.total-col{width:.72in}
  .hours-title{font-size:9px;line-height:1}.day-label{font-size:10px;color:#2784a9;text-transform:none;font-weight:700}
  .cell-input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:12px;outline:0;font-family:Arial,Helvetica,sans-serif}
  .name-input{text-align:left;padding-left:6px;font-size:12px}.role-tag{position:absolute;left:3px;top:1px;font-size:6.5px;text-transform:uppercase;color:#555;line-height:1}
  td.name-cell{position:relative;padding-top:6px!important}.name-cell .cell-input{padding-left:8px}
  .total{background:#f8fafc;font-weight:800;text-align:center;font-size:12px}.xcell{position:relative;background:#fafafa;height:100%}
  .xcell:before,.xcell:after{content:"";position:absolute;left:3px;right:3px;top:50%;border-top:1.6px solid #555;transform-origin:center}.xcell:before{transform:rotate(37deg)}.xcell:after{transform:rotate(-37deg)}
  .remove{float:right;margin:2px 2px 0 2px;border:0;background:#fee2e2;color:#7f1d1d;border-radius:4px;font-size:10px;padding:2px 4px;cursor:pointer}.add-row{margin:6px 0 8px;border:0;background:#dbeafe;border-radius:7px;padding:7px 9px;font-weight:800;cursor:pointer}
  .footer{border:2px solid var(--line);border-top:1px solid var(--line);font-size:11px}.foot-row{display:grid;grid-template-columns:1.35in 1fr 1.45in 1.65in;min-height:.31in;border-bottom:1px solid var(--line)}
  .foot-row:last-child{border-bottom:0}.foot-row>div{border-right:1px solid var(--line);padding:6px 7px}.foot-row>div:last-child{border-right:0}.foot-label{font-size:9px;color:#333}.foot-value{font-size:13px;font-weight:600}.page-total{font-weight:900;text-align:center;background:#fff8d8}
  .signature{height:.53in}.sig-box{height:.37in;border:1px dashed #777;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}.sig-box img{max-width:100%;max-height:100%;display:block}.sig-placeholder{font-size:8px;color:#666;text-align:center}.sig-caption{font-size:7px;text-align:center;margin-top:1px;color:#333}.fineprint{font-size:6.8px;text-align:center;line-height:1.2;padding-top:4px;color:#222}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.modal-card{width:min(720px,96vw);background:#fff;border-radius:12px;padding:14px;box-shadow:0 14px 44px rgba(0,0,0,.35)}.modal-card h2{margin:0 0 8px;font-size:18px}.canvas-wrap{border:2px solid #111;border-radius:8px;background:#fff;touch-action:none}.sig-canvas{width:100%;height:240px;display:block;touch-action:none}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.modal-actions button{border:0;border-radius:8px;padding:10px 12px;font-weight:800;cursor:pointer}.modal-actions .save{background:#0f172a;color:#fff}.modal-actions .clear{background:#fde68a}.modal-actions .cancel{background:#e5e7eb}.modal-actions .delete{background:#fecaca;color:#7f1d1d}
  @media(max-width:900px){.wrap{padding:10px 6px 24px}.sheet{width:100%;min-height:auto;overflow-x:auto;padding:.18in .12in}.union-title{font-size:13px}.toolbar input{min-width:130px}.toolbar-row{display:grid;grid-template-columns:1fr 1fr}.toolbar-row button{width:100%}.sig-canvas{height:220px}.form{min-width:760px}.footer{min-width:760px}.report-title,.union-title{min-width:760px}}
  @media print{body{background:#fff}.toolbar,.add-row,.remove,.modal,.sig-placeholder{display:none!important}.wrap{padding:0}.sheet{box-shadow:none;border:0;margin:0;padding:.25in .25in .18in;width:8.5in;min-height:10.95in}.form th,.form td{height:.30in}.union-title{font-size:19px}.sig-box{border:0}@page{size:letter portrait;margin:0}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="toolbar-inner">
    <div class="toolbar-row">
      <label>Week Ending <input id="weekEnding" type="date"></label><label>Employer <input id="employer" type="text"></label><label>Location of Job <input id="location" type="text"></label><label>General Contractor <input id="gc" type="text"></label><label>Contract # <input id="contract" type="text"></label>
    </div>
    <div class="toolbar-row">
      <button class="primary" onclick="saveData(true)">Save</button><button onclick="window.print()">Print / Save PDF</button><button onclick="downloadBackup()">Download Backup</button><button onclick="document.getElementById('importFile').click()">Import Backup</button><input id="importFile" type="file" accept="application/json" hidden onchange="importBackup(event)"><button class="danger" onclick="resetData()">Reset Original List</button>
    </div>
    <div class="note">Use Save to keep the report on this phone/computer. Use Print / Save PDF for the union copy. Click either signature box at the bottom of each page to sign with a finger, stylus, or mouse.</div>
  </div>
</div>
<main id="app" class="wrap"></main>
<div id="sigModal" class="modal" aria-hidden="true">
  <div class="modal-card">
    <h2 id="sigTitle">Sign</h2>
    <div class="canvas-wrap"><canvas id="sigCanvas" class="sig-canvas"></canvas></div>
    <div class="modal-actions"><button class="save" onclick="saveSignature()">Save Signature</button><button class="clear" onclick="clearCanvas()">Clear</button><button class="delete" onclick="deleteSignature()">Delete Saved Signature</button><button class="cancel" onclick="closeSignature()">Cancel</button></div>
  </div>
</div>
<script>
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const defaultData={employer:'Jagd Construction',location:'Dyre Ave Bronx',generalContractor:'Judlaw Contracting',contractNumber:'C-35311',weekEnding:'',pages:[
{page:1,total:3,signatures:{employerRep:'',jobSteward:''},workers:[{role:'FOREMAN',name:'Wilson Monteiro',ins:'11847'},{role:'SHOP STEWARD',name:'Helen Betances',ins:'20835'},{name:'Estefano Horning',ins:'11612'},{name:'Ruben Vasquez',ins:'11126'},{name:'Alison Dos Santos',ins:'20956'},{name:'Jefferson Domaleski',ins:'20338'},{name:'Joel Melgar',ins:'21139'},{name:'Maccin Polet Jr',ins:'21050'},{name:'Felix Gonzalez',ins:'21336'},{name:'Geanderson Campos',ins:'21167'},{name:'Tyler Saradene',ins:'21415'},{name:'Robert Young',ins:'DC21'},{name:'Jima Horning',ins:'21440'},{name:'Henry Melgar',ins:'21199'},{name:'Juan Castelhano',ins:'21333'},{name:'Marcos Diaz',ins:'21031'},{name:'Rivaldo Dos Santos',ins:'21060'},{name:'Victoria Veloso',ins:'21449'},{name:'Albin Cardona',ins:'DC51'},{name:'Timothy Ladd',ins:'20588'},{name:'Ismael Brasilino',ins:'20864'}]},
{page:2,total:3,signatures:{employerRep:'',jobSteward:''},workers:[{role:'FOREMAN',name:'Wilson Monteiro',ins:'11847',crossed:true},{role:'SHOP STEWARD',name:'Helen Betances',ins:'20835',crossed:true},{name:'Fabiano Rodrigues',ins:'21078'},{name:'Rafael De Castro',ins:'21007'},{name:'Mayron Sales',ins:'DC21'},{name:'Dicesar Miranda',ins:'11735'},{name:'Alex Mikelen Miranda',ins:'21334'},{name:'Deyvid De Oliveira',ins:'21244'},{name:'Gustavo Pereira',ins:'20153'},{name:'Roman Amparo',ins:'21770'},{name:'Oscar Marge',ins:'DC51'},{name:'Carlos Lopez',ins:'DC51'},{name:'Yonig Cruz',ins:'DC51'},{name:'Moises Sotta',ins:'DC51'},{name:'Jared Arista',ins:'21416'},{name:'Anthony Lovich',ins:'11175'},{name:'Anderson Ceranto',ins:'11804'},{name:'Chiver Pereira',ins:'20817'},{name:'Romel Guzhnay',ins:'21214'},{name:'Elber Flores',ins:'DC21'},{name:'Marcos Costa',ins:'DC21'}]},
{page:3,total:3,signatures:{employerRep:'',jobSteward:''},workers:[{role:'FOREMAN',name:'Wilson Monteiro',ins:'11847',crossed:true},{role:'SHOP STEWARD',name:'Helen Betances',ins:'20835',crossed:true},{name:'Jorge Santiago',ins:'11779'},{name:'Emerson E Haile',ins:'21335'},{name:'Gabriel De Almeida',ins:'DC21'},{name:'Raymond Roaett',ins:'20431'},{name:'Beau Forget',ins:'20553'},{name:'Stephen Tillman',ins:'DC91'},{name:'Antonio Silvzalo',ins:'DC21'}]}]};
let data=JSON.parse(localStorage.getItem('local806StewardReportV3')||JSON.stringify(defaultData));
let activeSig=null;let drawing=false;let last=null;const modal=document.getElementById('sigModal');const canvas=document.getElementById('sigCanvas');const ctx=canvas.getContext('2d');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n}function fmt(n){return n?(Math.round(n*10)/10).toFixed(1).replace(/\.0$/,''):''}function workerTotal(w){return w.crossed?0:days.reduce((t,d)=>t+num(w[d]),0)}function pageTotal(p){return p.workers.reduce((t,w)=>t+workerTotal(w),0)}
function syncTop(){['weekEnding','employer','location'].forEach(id=>document.getElementById(id).value=data[id]||'');document.getElementById('gc').value=data.generalContractor||'';document.getElementById('contract').value=data.contractNumber||''}function saveTop(){data.weekEnding=document.getElementById('weekEnding').value;data.employer=document.getElementById('employer').value;data.location=document.getElementById('location').value;data.generalContractor=document.getElementById('gc').value;data.contractNumber=document.getElementById('contract').value}
function sigHtml(pi,type){const src=data.pages[pi].signatures?.[type]||'';return `<div class="sig-box" onclick="openSignature(${pi},'${type}')">${src?`<img src="${src}" alt="signature">`:`<span class="sig-placeholder">Tap/click to sign</span>`}</div><div class="sig-caption">${type==='employerRep'?'Employer Rep.':'Job Steward'}</div>`}
function render(){syncTop();const app=document.getElementById('app');app.innerHTML='';data.pages.forEach((p,pi)=>{p.signatures=p.signatures||{employerRep:'',jobSteward:''};const section=document.createElement('section');section.className='sheet';section.innerHTML=`<div class="union-title">Structural Steel Painters of Greater New York, Local Union 806</div><div class="report-title"><div class="main">JOB STEWARD'S WEEKLY REPORT</div><div class="pageNo">Page <u>${p.page}</u> of <u>${p.total}</u></div></div><table class="form"><colgroup><col class="name-col"><col class="ins-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="total-col"></colgroup><thead><tr><th rowspan="2">NAME OF MEMBERS</th><th rowspan="2">Ins.<br>No.</th><th colspan="7" class="hours-title">HOURS WORKED ONLY</th><th rowspan="2">TOTAL<br>TIME</th></tr><tr>${days.map(d=>`<th><span class="day-label">${d}</span></th>`).join('')}</tr></thead><tbody></tbody></table><button class="add-row" onclick="addWorker(${pi})">+ Add worker to this page</button><div class="footer"><div class="foot-row"><div class="foot-label">Employer's Name:</div><div class="foot-value">${esc(data.employer)}</div><div class="foot-label">Week Ending:</div><div class="foot-value">${esc(data.weekEnding)}</div></div><div class="foot-row"><div class="foot-label">Location of Job:</div><div class="foot-value">${esc(data.location)}</div><div class="foot-label">Total Hours This Page:</div><div class="page-total">${fmt(pageTotal(p))}</div></div><div class="foot-row"><div class="foot-label">General Contractor:</div><div class="foot-value">${esc(data.generalContractor)}</div><div class="foot-label">Contract Number:</div><div class="foot-value">${esc(data.contractNumber)}</div></div><div class="foot-row signature"><div class="foot-label">Signed</div><div>${sigHtml(pi,'employerRep')}</div><div class="foot-label">Signed</div><div>${sigHtml(pi,'jobSteward')}</div></div><div class="fineprint">Men are required to fill in the correct amount of hours worked each day.<br>Stewards will be held responsible for the correctness of this report.<br>Report all accidents to your Business Agent immediately.</div></div>`;const tbody=section.querySelector('tbody');const minRows=22;for(let wi=0;wi<Math.max(minRows,p.workers.length);wi++){const w=p.workers[wi]||{name:'',ins:''};const tr=document.createElement('tr');const removeButton=p.workers[wi]?`<button class="remove" onclick="removeWorker(${pi},${wi})">remove</button>`:'';tr.innerHTML=`<td class="name-cell">${w.role?`<span class="role-tag">${esc(w.role)}</span>`:''}${removeButton}<input class="cell-input name-input" value="${esc(w.name)}" onchange="setWorker(${pi},${wi},'name',this.value)"></td><td><input class="cell-input" value="${esc(w.ins)}" onchange="setWorker(${pi},${wi},'ins',this.value)"></td>${days.map(d=>w.crossed?`<td><div class="xcell"></div></td>`:`<td><input class="cell-input" inputmode="decimal" value="${esc(w[d]||'')}" onchange="setWorker(${pi},${wi},'${d}',this.value)" oninput="setWorker(${pi},${wi},'${d}',this.value,false)"></td>`).join('')}<td class="total">${w.crossed?'':fmt(workerTotal(w))}</td>`;tbody.appendChild(tr)}app.appendChild(section)});}
function ensureWorker(pi,wi){while(!data.pages[pi].workers[wi])data.pages[pi].workers.push({name:'',ins:''})}function setWorker(pi,wi,key,val,rerender=true){ensureWorker(pi,wi);data.pages[pi].workers[wi][key]=val;if(rerender){saveData(false);render()}else{localStorage.setItem('local806StewardReportV3',JSON.stringify(data))}}function addWorker(pi){data.pages[pi].workers.push({name:'',ins:''});saveData(false);render()}function removeWorker(pi,wi){if(data.pages[pi].workers[wi]?.crossed){alert('This crossed-out union header row stays on Page 2 and Page 3.');return}if(confirm('Remove this worker from this page?')){data.pages[pi].workers.splice(wi,1);saveData(false);render()}}
function saveData(show){saveTop();localStorage.setItem('local806StewardReportV3',JSON.stringify(data));if(show)alert('Saved on this device/browser.')}function resetData(){if(confirm('Reset back to the original prefilled 3-page list and clear hours/signatures?')){localStorage.removeItem('local806StewardReportV3');data=JSON.parse(JSON.stringify(defaultData));render()}}
function downloadBackup(){saveData(false);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='local-806-steward-report-backup.json';a.click();URL.revokeObjectURL(a.href)}function importBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);saveData(false);render();alert('Backup imported.')}catch(err){alert('Could not import this backup.')}};r.readAsText(file)}
function resizeCanvas(){const ratio=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=rect.width*ratio;canvas.height=rect.height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.fillStyle='#fff';ctx.fillRect(0,0,rect.width,rect.height)}function pos(e){const r=canvas.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function startDraw(e){e.preventDefault();drawing=true;last=pos(e)}function moveDraw(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function endDraw(e){drawing=false;last=null}function clearCanvas(){const r=canvas.getBoundingClientRect();ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height)}
function openSignature(pi,type){saveTop();activeSig={pi,type};document.getElementById('sigTitle').textContent=(type==='employerRep'?'Employer Rep. Signature':'Job Steward Signature')+' - Page '+data.pages[pi].page;modal.classList.add('show');modal.setAttribute('aria-hidden','false');setTimeout(()=>{resizeCanvas();const src=data.pages[pi].signatures?.[type];if(src){const img=new Image();img.onload=()=>{clearCanvas();ctx.drawImage(img,0,0,canvas.getBoundingClientRect().width,canvas.getBoundingClientRect().height)};img.src=src}},30)}function closeSignature(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true');activeSig=null}function saveSignature(){if(!activeSig)return;data.pages[activeSig.pi].signatures=data.pages[activeSig.pi].signatures||{};data.pages[activeSig.pi].signatures[activeSig.type]=canvas.toDataURL('image/png');saveData(false);closeSignature();render()}function deleteSignature(){if(!activeSig)return;if(confirm('Delete this saved signature?')){data.pages[activeSig.pi].signatures[activeSig.type]='';saveData(false);closeSignature();render()}}
canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',moveDraw);window.addEventListener('mouseup',endDraw);canvas.addEventListener('touchstart',startDraw,{passive:false});canvas.addEventListener('touchmove',moveDraw,{passive:false});canvas.addEventListener('touchend',endDraw);window.addEventListener('resize',()=>{if(modal.classList.contains('show'))resizeCanvas()});['weekEnding','employer','location','gc','contract'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{saveData(false);render()}));
render();
</script>
</body>
</html>
