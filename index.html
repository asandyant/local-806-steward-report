<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local 806 Job Steward Weekly Report</title>
<style>
  :root{--ink:#111;--line:#111;--blue:#2084b7;--paper:#fff;--ui:#111827}
  *{box-sizing:border-box}
  html,body{margin:0;background:#e6e7eb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  .toolbar{position:sticky;top:0;z-index:20;background:#111827;padding:10px 12px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
  .toolbar-inner{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar button{border:0;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:900;cursor:pointer;background:#e5e7eb;color:#111827}
  .toolbar button.primary{background:#38bdf8;color:#06283d}
  .wrap{padding:22px 10px 44px}
  .sheet{width:8.5in;min-height:11in;margin:0 auto 24px;background:var(--paper);padding:.50in .36in .23in;border:1px solid #999;box-shadow:0 10px 28px rgba(0,0,0,.16);page-break-after:always}
  .sheet-inner{border:2px solid var(--line);background:#fff}
  .union-title{height:.50in;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:900;letter-spacing:.05px;border-bottom:1px solid var(--line);white-space:nowrap;padding:0 10px}
  .report-title{height:.36in;display:grid;grid-template-columns:1fr 1.3in;align-items:center;border-bottom:2px solid var(--line)}
  .report-title .main{text-align:center;font-size:14px;font-weight:900;letter-spacing:.2px}
  .page-no{text-align:center;font-size:12px}
  table.report{width:100%;border-collapse:collapse;table-layout:fixed;border-bottom:1px solid var(--line)}
  table.report th,table.report td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:middle}
  table.report tr>*:last-child{border-right:0}
  table.report thead th{height:.31in;text-align:center;font-weight:800;font-size:9.5px;background:#fff;text-transform:uppercase}
  .name-col{width:2.55in}.ins-col{width:.72in}.day-col{width:.52in}.total-col{width:.70in}
  .hours-title{font-size:9px;line-height:1}
  .day-label{font-size:8.2px;color:var(--blue);text-transform:none;font-weight:700}
  .data-row td{height:.304in}
  .name-cell{position:relative;padding:0 3px!important}
  .role-tag{position:absolute;left:4px;top:2px;font-size:5.7px;line-height:1;text-transform:uppercase;color:#4b5563;z-index:1}
  .name-grid{display:grid;grid-template-columns:1fr 34px;align-items:center;gap:2px;width:100%;height:100%;padding-top:6px}
  .name-input,.ins-input,.foot-input{width:100%;border:0;background:transparent;outline:0;font-family:Arial,Helvetica,sans-serif;color:#000;border-radius:0}
  .name-input{font-size:12px;text-align:left;padding:0 2px 0 6px;height:18px;line-height:18px}
  .ins-input{text-align:center;font-size:12px;height:100%}
  .edit-btn{border:0;background:#e0f2fe;color:#075985;border-radius:4px;padding:2px 4px;font-size:9px;font-weight:800;cursor:pointer}
  .edit-btn.blank{visibility:hidden}
  .hour-input{width:100%;height:100%;border:0;background:transparent;font-size:12px;font-family:Arial,Helvetica,sans-serif;text-align:center;padding:0;color:#000;outline:0;border-radius:0}
  .hour-input.mark-x{font-weight:900;letter-spacing:.4px}
  .total-cell{background:#f8fafc;text-align:center;font-size:12px;font-weight:800}
  .xcell{position:relative;height:100%;background:#fff}
  .xcell:before,.xcell:after{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:1.3px solid #555;transform-origin:center}
  .xcell:before{transform:rotate(35deg)}.xcell:after{transform:rotate(-35deg)}
  .footer{font-size:10px}
  .foot-line{display:grid;grid-template-columns:1.35in 1fr 1.45in 1.75in;min-height:.31in;border-bottom:1px solid var(--line)}
  .foot-line:last-child{border-bottom:0}
  .foot-line>div{border-right:1px solid var(--line);display:flex;align-items:center;padding:3px 5px}
  .foot-line>div:last-child{border-right:0}
  .foot-label{font-size:9px;color:#333}
  .foot-input{height:24px;font-size:13px;padding:0}
  .page-total{background:#fffbe6;font-size:14px;font-weight:900;text-align:center;justify-content:center!important}
  .sig-line{min-height:.54in}
  .sig-box{width:100%;height:.38in;border:1px dashed #777;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .sig-box img{max-width:100%;max-height:100%}
  .sig-placeholder{font-size:8px;color:#666}
  .sig-caption{font-size:7px;text-align:center;color:#333;line-height:1.1}
  .sig-wrap{width:100%}
  .fineprint{font-size:6.2px;line-height:1.15;text-align:center;padding:3px 0 2px;color:#222}
  .footer-logo{display:flex;justify-content:center;align-items:center;padding:1px 0 3px}
  .footer-logo img{height:.34in;width:auto;filter:grayscale(100%) contrast(160%)}
  .sheet-actions{display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap}
  .sheet-actions button{border:0;border-radius:7px;background:#dbeafe;padding:8px 10px;font-weight:900;cursor:pointer}
  .sheet-actions .small-hint{font-size:12px;color:#374151;align-self:center}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}
  .modal.show{display:flex}
  .modal-card{width:min(720px,96vw);background:#fff;border-radius:12px;padding:14px;box-shadow:0 14px 44px rgba(0,0,0,.35)}
  .modal-card h2{margin:0 0 10px;font-size:18px}
  .modal-card p{margin:0 0 10px;font-size:13px;color:#334155}
  .modal-card label{display:grid;gap:4px;margin-bottom:8px;font-size:12px;font-weight:800}
  .modal-card input{border:1px solid #cbd5e1;border-radius:8px;padding:9px;font-size:15px}
  .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .modal-actions button{border:0;border-radius:8px;padding:10px 12px;font-weight:900;cursor:pointer}
  .modal-actions .save{background:#0f172a;color:#fff}
  .modal-actions .clear{background:#fde68a}
  .modal-actions .cancel{background:#e5e7eb}
  .modal-actions .delete{background:#fecaca;color:#7f1d1d}
  .modal-actions .xmark{background:#e0f2fe;color:#075985}
  .canvas-wrap{border:2px solid #111;border-radius:8px;background:#fff;touch-action:none}
  .sig-canvas{width:100%;height:240px;display:block;touch-action:none}
  @media(max-width:900px){
    .toolbar-inner{display:grid;grid-template-columns:1fr 1fr}
    .toolbar button{width:100%}
    .wrap{padding:10px 4px 30px}
    .sheet{width:100%;min-height:auto;padding:.15in .08in}
    .sheet-inner,.sheet-actions{min-width:7.55in}
    .union-title{font-size:15px}
    .report-title{grid-template-columns:1fr 1.05in}
    .day-label{font-size:7.8px}
    .sig-canvas{height:220px}
  }
  body.pdf-capture .toolbar,
  body.pdf-capture .sheet-actions,
  body.pdf-capture .edit-btn,
  body.pdf-capture .sig-placeholder{display:none!important}
  body.pdf-capture .sheet{box-shadow:none;border:0;margin:0 auto;background:#fff}
  body.pdf-capture .sig-box{border:0}
  body.pdf-capture input{-webkit-appearance:none;appearance:none}
  @media print{
    body{background:#fff}
    .toolbar,.sheet-actions,.edit-btn,.modal,.sig-placeholder{display:none!important}
    .wrap{padding:0}
    .sheet{box-shadow:none;border:0;margin:0;padding:.22in .25in .10in;width:8.5in;height:11in;min-height:0;overflow:hidden;page-break-after:always;break-after:page}
    .sheet-inner{min-width:0}
    .union-title{font-size:20px}
    .name-grid{grid-template-columns:1fr}
    .sig-box{border:0}
    .hour-input{cursor:default;-webkit-appearance:none;appearance:none}
    .union-title{height:.42in;font-size:18px}.report-title{height:.30in}.data-row td{height:.265in}.foot-line{min-height:.25in}.sig-line{min-height:.42in}.sig-box{height:.28in}.fineprint{font-size:5.3px;line-height:1.05;padding:2px 0 1px}.footer-logo img{height:.22in}@page{size:letter portrait;margin:0}
  }
</style>
</head>

const storageKeys=['local806StewardReportV6','local806StewardReportV5','local806StewardReportV4','local806StewardReportV3'];
let data=loadData();
let activeSig=null; const sigModal=document.getElementById('sigModal'); const canvas=document.getElementById('sigCanvas'); const ctx=canvas.getContext('2d'); let drawing=false,last=null;
const workerModal=document.getElementById('workerModal'); let holdTimer=null;

function deepCopy(obj){return JSON.parse(JSON.stringify(obj))}
function loadData(){
  for(const key of storageKeys){
    try{const raw=localStorage.getItem(key); if(raw){return JSON.parse(raw)}}catch(e){}
  }
  return deepCopy(defaultData);
}
function saveRaw(){localStorage.setItem('local806StewardReportV6',JSON.stringify(data));}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function num(v){if(v==null)return 0; if(typeof v==='string' && v.trim().toUpperCase()==='X') return 0; const n=parseFloat(String(v).trim()); return isNaN(n)?0:n}
function fmt(n){return n?(Math.round(n*10)/10).toFixed(1).replace(/\.0$/,''):''}
function hasNumericHours(w){return days.some(d=>{const raw=w[d]; return raw!=='' && raw!=null && !isNaN(parseFloat(String(raw).trim()))})}
function workerTotal(w){return w.crossed?0:days.reduce((t,d)=>t+num(w[d]),0)}
function displayWorkerTotal(w){return hasNumericHours(w)?fmt(workerTotal(w)):''}
function pageTotal(p){return p.workers.reduce((t,w)=>t+workerTotal(w),0)}
function saveData(show){saveRaw();}
function setTop(key,val){data[key]=val; saveRaw(); renderFootTotalsOnly();}
function setPageWorker(pi,wi,key,val){if(!data.pages[pi]||!data.pages[pi].workers[wi]) return; data.pages[pi].workers[wi][key]=val; saveRaw(); renderFootTotalsOnly();}
function renderFootTotalsOnly(){
  document.querySelectorAll('[data-page-total]').forEach(el=>{const pi=+el.dataset.pageTotal; el.textContent=fmt(pageTotal(data.pages[pi]));});
  document.querySelectorAll('[data-worker-total]').forEach(el=>{const [pi,wi]=el.dataset.workerTotal.split('-').map(Number); const w=data.pages[pi]?.workers[wi]; el.textContent=w&& !w.crossed ? displayWorkerTotal(w) : '';});
  document.querySelectorAll('[data-hour-display]').forEach(el=>{const [pi,wi,day]=el.dataset.hourDisplay.split('|'); const val=data.pages[+pi]?.workers[+wi]?.[day]||''; if(el.value!==val) el.value=val; el.classList.toggle('mark-x', String(val).trim().toUpperCase()==='X');});
}
function sigHtml(pi,type){const src=data.pages[pi].signatures?.[type]||''; return '<div class="sig-wrap"><div class="sig-box" onclick="openSignature('+pi+',\''+type+'\')">'+(src?'<img src="'+src+'" alt="signature">':'<span class="sig-placeholder">Tap/click to sign</span>')+'</div><div class="sig-caption">'+(type==='employerRep'?'Employer Rep.':'Job Steward')+'</div></div>';}

  const app=document.getElementById('app'); app.innerHTML='';
  data.pages.forEach((p,pi)=>{

    section.innerHTML='<div class="sheet-inner">'+

      '<div class="sheet-actions"><button onclick="addWorker('+pi+')">+ Add worker to page '+p.page+'</button><span class="small-hint">Tap a day box to enter hours or mark an X.</span></div>';
    const tbody=section.querySelector('tbody');
    const minRows=22;
    for(let wi=0; wi<Math.max(minRows,p.workers.length); wi++){
      const w=p.workers[wi]||blankWorker(); const real=!!p.workers[wi];
      const tr=document.createElement('tr'); tr.className='data-row';
      tr.innerHTML='<td class="name-cell">'+(w.role?'<span class="role-tag">'+esc(w.role)+'</span>':'')+'<div class="name-grid"><input class="name-input" value="'+esc(w.name)+'" onchange="setPageWorker('+pi+','+wi+',\'name\',this.value)" '+(real?'':'disabled')+'>'+(real?'<button class="edit-btn" onclick="openWorkerEdit('+pi+','+wi+')">Edit</button>':'<button class="edit-btn blank">Edit</button>')+'</div></td>'+
        '<td><input class="ins-input" value="'+esc(w.ins)+'" onchange="setPageWorker('+pi+','+wi+',\'ins\',this.value)" '+(real?'':'disabled')+'></td>'+
        days.map(d=>{
          if(w.crossed) return '<td><div class="xcell"></div></td>';

function resizeCanvas(){const ratio=window.devicePixelRatio||1; const rect=canvas.getBoundingClientRect(); canvas.width=rect.width*ratio; canvas.height=rect.height*ratio; ctx.setTransform(ratio,0,0,ratio,0,0); ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111'; ctx.fillStyle='#fff'; ctx.fillRect(0,0,rect.width,rect.height)}

function pdfEscape(text){
  return String(text??'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');

function loadImg(src){
  return new Promise(resolve=>{
    if(!src) return resolve(null);
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>resolve(null);
    img.src=src;
  });
}
function drawFitText(ctx,text,x,y,maxW,size=8,bold=false,align='left'){
  text=String(text??'');
  ctx.font=(bold?'bold ':'')+size+'px Arial';
  ctx.textAlign=align;
  ctx.textBaseline='middle';
  let shown=text;
  while(ctx.measureText(shown).width>maxW && shown.length>1){ shown=shown.slice(0,-2)+'…'; }
  ctx.fillText(shown,x,y);
}
function drawXLines(ctx,x,y,w,h){
  ctx.beginPath();
  ctx.moveTo(x+4,y+3); ctx.lineTo(x+w-4,y+h-3);
  ctx.moveTo(x+w-4,y+3); ctx.lineTo(x+4,y+h-3);
  ctx.stroke();
}
async function drawReportPageToCanvas(pi){

  ctx.scale(scale,scale);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,612,792);

  const p=data.pages[pi];

  colX.push(x0+w);

  function rect(x,y,w,h){ctx.strokeRect(x,y,w,h);}
  function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

  // Title
  rect(x0,y,w,titleH);
  drawFitText(ctx,'Structural Steel Painters of Greater New York, Local Union 806',x0+w/2,y+titleH/2,w-20,15,true,'center');
  y+=titleH;

  rect(x0,y,w,reportH);
  drawFitText(ctx,"JOB STEWARD'S WEEKLY REPORT",x0+w/2,y+reportH/2,300,10,true,'center');
  drawFitText(ctx,'Page '+p.page+' of '+p.total,x0+w-14,y+reportH/2,80,9,false,'right');
  y+=reportH;

  const tableTop=y;
  // Header merged cells
  rect(x0,y,nameW,head1+head2);
  rect(x0+nameW,y,insW,head1+head2);
  rect(x0+nameW+insW,y,dayW*7,head1);
  rect(x0+nameW+insW+dayW*7,y,totalW,head1+head2);
  drawFitText(ctx,'NAME OF MEMBERS',x0+nameW/2,y+(head1+head2)/2,130,7,true,'center');
  drawFitText(ctx,'INS.\nNO.',x0+nameW+insW/2,y+(head1+head2)/2,36,7,true,'center');
  drawFitText(ctx,'HOURS WORKED ONLY',x0+nameW+insW+(dayW*7)/2,y+head1/2,150,7,true,'center');
  drawFitText(ctx,'TOTAL\nTIME',x0+w-totalW/2,y+(head1+head2)/2,34,7,true,'center');
  for(let i=0;i<7;i++){
    rect(x0+nameW+insW+dayW*i,y+head1,dayW,head2);
    ctx.fillStyle='#2084b7';
    drawFitText(ctx,days[i],x0+nameW+insW+dayW*i+dayW/2,y+head1+head2/2,dayW-2,5.8,true,'center');
    ctx.fillStyle='#000';
  }
  y+=head1+head2;

  const minRows=22;
  for(let wi=0; wi<minRows; wi++){
    const worker=p.workers[wi] || {};
    rect(x0,y,nameW,rowH);
    rect(x0+nameW,y,insW,rowH);
    for(let i=0;i<7;i++) rect(x0+nameW+insW+dayW*i,y,dayW,rowH);
    rect(x0+nameW+insW+dayW*7,y,totalW,rowH);

    if(worker.role) drawFitText(ctx,worker.role,x0+3,y+3,nameW-8,4.5,false,'left');
    drawFitText(ctx,worker.name||'',x0+7,y+rowH/2+2,nameW-14,8.5,false,'left');
    drawFitText(ctx,worker.ins||'',x0+nameW+insW/2,y+rowH/2,insW-4,8,false,'center');

    for(let i=0;i<7;i++){
      const d=days[i], cx=x0+nameW+insW+dayW*i;

      else {
        const val=worker[d]||'';

    if(worker && !worker.crossed) drawFitText(ctx,displayWorkerTotal(worker),x0+w-totalW/2,y+rowH/2,totalW-4,8.5,true,'center');
    y+=rowH;

  // Footer
  const f1=25, fSig=38, fineH=16, logoH=20;

  function footerRow(h,label1,value1,label2,value2,value2Bold=false){
    rect(x0,y,lab1,h); rect(x0+lab1,y,val1,h); rect(x0+lab1+val1,y,lab2,h); rect(x0+lab1+val1+lab2,y,val2,h);
    drawFitText(ctx,label1,x0+4,y+h/2,lab1-8,6,false,'left');
    drawFitText(ctx,value1,x0+lab1+6,y+h/2,val1-12,9,false,'left');
    drawFitText(ctx,label2,x0+lab1+val1+4,y+h/2,lab2-8,6,false,'left');
    drawFitText(ctx,value2,x0+lab1+val1+lab2+val2/2,y+h/2,val2-8,value2Bold?10:9,value2Bold,'center');
    y+=h;
  }
  footerRow(f1,"Employer's Name:",data.employer,'Week Ending:',data.weekEnding?new Date(data.weekEnding+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'');
  footerRow(f1,'Location of Job:',data.location,'Total Hours This Page:',fmt(pageTotal(p)),true);
  footerRow(f1,'General Contractor:',data.generalContractor,'Contract Number:',data.contractNumber);

  // Signature row
  rect(x0,y,lab1,fSig); rect(x0+lab1,y,val1,fSig); rect(x0+lab1+val1,y,lab2,fSig); rect(x0+lab1+val1+lab2,y,val2,fSig);
  drawFitText(ctx,'Signed',x0+4,y+11,lab1-8,6,false,'left');
  drawFitText(ctx,'Signed',x0+lab1+val1+4,y+11,lab2-8,6,false,'left');
  const sig1=await loadImg(p.signatures?.employerRep);
  const sig2=await loadImg(p.signatures?.jobSteward);
  if(sig1) ctx.drawImage(sig1,x0+lab1+8,y+4,val1-16,fSig-14);
  if(sig2) ctx.drawImage(sig2,x0+lab1+val1+lab2+8,y+4,val2-16,fSig-14);
  drawFitText(ctx,'Employer Rep.',x0+lab1+val1/2,y+fSig-5,70,5,false,'center');
  drawFitText(ctx,'Job Steward',x0+lab1+val1+lab2+val2/2,y+fSig-5,70,5,false,'center');
  y+=fSig;

  rect(x0,y,w,fineH);
  drawFitText(ctx,'Men are required to fill in the correct amount of hours worked each day.',x0+w/2,y+4,w-20,4.6,false,'center');
  drawFitText(ctx,'Stewards will be held responsible for the correctness of this report.',x0+w/2,y+8.8,w-20,4.6,false,'center');
  drawFitText(ctx,'Report all accidents to your Business Agent immediately.',x0+w/2,y+13.4,w-20,4.6,false,'center');
  y+=fineH;

  rect(x0,y,w,logoH);
  const logo=await loadImg(logoSrc);
  if(logo) ctx.drawImage(logo,x0+w/2-8,y+2,16,16);
  return canvas;
}
function binaryFromDataUrl(dataUrl){
  return atob(dataUrl.split(',')[1]);
}
function buildPdfFromJpegs(images){
  let objects=[];
  function add(str){objects.push(str); return objects.length;}
  const pagesId=2;
  let kids=[];
  images.forEach((img,idx)=>{
    const pageId=3+idx*3, imgId=pageId+1, contentId=pageId+2;
    kids.push(pageId+' 0 R');
    add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im'+idx+' '+imgId+' 0 R >> >> /Contents '+contentId+' 0 R >>');
    add('<< /Type /XObject /Subtype /Image /Width '+img.width+' /Height '+img.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.bin.length+' >>\nstream\n'+img.bin+'\nendstream');
    const content='q 612 0 0 792 0 0 cm /Im'+idx+' Do Q';
    add('<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream');
  });
  objects.unshift('<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+images.length+' >>');
  objects.unshift('<< /Type /Catalog /Pages 2 0 R >>');

  let pdf='%PDF-1.3\n';
  let offsets=[0];
  objects.forEach((obj,i)=>{
    offsets.push(pdf.length);
    pdf+=(i+1)+' 0 obj\n'+obj+'\nendobj\n';
  });
  const xref=pdf.length;
  pdf+='xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<offsets.length;i++) pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  pdf+='trailer\n<< /Size '+(objects.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  const bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&255;
  return new Blob([bytes],{type:'application/pdf'});
}
async function printCleanReport(){
  saveRaw();
  try{
    const images=[];
    for(let i=0;i<data.pages.length;i++){
      const canvas=await drawReportPageToCanvas(i);
      images.push({bin:binaryFromDataUrl(canvas.toDataURL('image/jpeg',0.92)),width:canvas.width,height:canvas.height});
    }
    const blob=buildPdfFromJpegs(images);
    const url=URL.createObjectURL(blob);
    const fileName='Local-806-Steward-Report-'+(data.weekEnding||new Date().toISOString().slice(0,10))+'.pdf';
    const a=document.createElement('a');
    a.href=url; a.download=fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>{ window.open(url,'_blank'); },150);
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(err){
    alert('Could not create the clean PDF on this device: '+err.message);
  }
}
