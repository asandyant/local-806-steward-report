<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local 806 Job Steward Weekly Report</title>
<style>
  :root{--ink:#111;--line:#111;--blue:#2084b7;--paper:#fff;--ui:#111827}
  *{box-sizing:border-box}
  html,body{margin:0;background:#e6e7eb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  .toolbar{position:sticky;top:0;z-index:20;background:#111827;padding:10px 12px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
  .toolbar-inner{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar button{border:0;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:900;cursor:pointer;background:#e5e7eb;color:#111827}
  .toolbar button.primary{background:#38bdf8;color:#06283d}
  .wrap{padding:22px 10px 44px}
  .sheet{width:8.5in;min-height:11in;margin:0 auto 24px;background:var(--paper);padding:.50in .36in .23in;border:1px solid #999;box-shadow:0 10px 28px rgba(0,0,0,.16);page-break-after:always}
  .sheet-inner{border:2px solid var(--line);background:#fff}
  .union-title{height:.50in;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;font-weight:900;letter-spacing:.05px;border-bottom:1px solid var(--line);white-space:nowrap;padding:0 10px}
  .report-title{height:.36in;display:grid;grid-template-columns:1fr 1.3in;align-items:center;border-bottom:2px solid var(--line)}
  .report-title .main{text-align:center;font-size:14px;font-weight:900;letter-spacing:.2px}
  .page-no{text-align:center;font-size:12px}
  table.report{width:100%;border-collapse:collapse;table-layout:fixed;border-bottom:1px solid var(--line)}
  table.report th,table.report td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:middle}
  table.report tr>*:last-child{border-right:0}
  table.report thead th{height:.31in;text-align:center;font-weight:800;font-size:9.5px;background:#fff;text-transform:uppercase}
  .name-col{width:2.55in}.ins-col{width:.72in}.day-col{width:.52in}.total-col{width:.70in}
  .hours-title{font-size:9px;line-height:1}
  .day-label{font-size:8.2px;color:var(--blue);text-transform:none;font-weight:700}
  .data-row td{height:.304in}
  .name-cell{position:relative;padding:0 3px!important}
  .role-tag{position:absolute;left:4px;top:2px;font-size:5.7px;line-height:1;text-transform:uppercase;color:#4b5563;z-index:1}
  .name-grid{display:grid;grid-template-columns:1fr 34px;align-items:center;gap:2px;width:100%;height:100%;padding-top:6px}
  .name-input,.ins-input,.foot-input{width:100%;border:0;background:transparent;outline:0;font-family:Arial,Helvetica,sans-serif;color:#000;border-radius:0}
  .name-input{font-size:12px;text-align:left;padding:0 2px 0 6px;height:18px;line-height:18px}
  .ins-input{text-align:center;font-size:12px;height:100%}
  .edit-btn{border:0;background:#e0f2fe;color:#075985;border-radius:4px;padding:2px 4px;font-size:9px;font-weight:800;cursor:pointer}
  .edit-btn.blank{visibility:hidden}
  .hour-btn{width:100%;height:100%;border:0;background:transparent;font-size:12px;font-family:Arial,Helvetica,sans-serif;cursor:pointer;text-align:center;padding:0;color:#000}
  .hour-btn.mark-x{font-weight:900;letter-spacing:.4px}
  .total-cell{background:#f8fafc;text-align:center;font-size:12px;font-weight:800}
  .xcell{position:relative;height:100%;background:#fff}
  .xcell:before,.xcell:after{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:1.3px solid #555;transform-origin:center}
  .xcell:before{transform:rotate(35deg)}.xcell:after{transform:rotate(-35deg)}
  .footer{font-size:10px}
  .foot-line{display:grid;grid-template-columns:1.35in 1fr 1.45in 1.75in;min-height:.31in;border-bottom:1px solid var(--line)}
  .foot-line:last-child{border-bottom:0}
  .foot-line>div{border-right:1px solid var(--line);display:flex;align-items:center;padding:3px 5px}
  .foot-line>div:last-child{border-right:0}
  .foot-label{font-size:9px;color:#333}
  .foot-input{height:24px;font-size:13px;padding:0}
  .page-total{background:#fffbe6;font-size:14px;font-weight:900;text-align:center;justify-content:center!important}
  .sig-line{min-height:.54in}
  .sig-box{width:100%;height:.38in;border:1px dashed #777;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .sig-box img{max-width:100%;max-height:100%}
  .sig-placeholder{font-size:8px;color:#666}
  .sig-caption{font-size:7px;text-align:center;color:#333;line-height:1.1}
  .sig-wrap{width:100%}
  .fineprint{font-size:6.2px;line-height:1.15;text-align:center;padding:3px 0 2px;color:#222}
  .footer-logo{display:flex;justify-content:center;align-items:center;padding:1px 0 3px}
  .footer-logo img{height:.34in;width:auto;filter:grayscale(100%) contrast(160%)}
  .sheet-actions{display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap}
  .sheet-actions button{border:0;border-radius:7px;background:#dbeafe;padding:8px 10px;font-weight:900;cursor:pointer}
  .sheet-actions .small-hint{font-size:12px;color:#374151;align-self:center}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}
  .modal.show{display:flex}
  .modal-card{width:min(720px,96vw);background:#fff;border-radius:12px;padding:14px;box-shadow:0 14px 44px rgba(0,0,0,.35)}
  .modal-card h2{margin:0 0 10px;font-size:18px}
  .modal-card p{margin:0 0 10px;font-size:13px;color:#334155}
  .modal-card label{display:grid;gap:4px;margin-bottom:8px;font-size:12px;font-weight:800}
  .modal-card input{border:1px solid #cbd5e1;border-radius:8px;padding:9px;font-size:15px}
  .modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .modal-actions button{border:0;border-radius:8px;padding:10px 12px;font-weight:900;cursor:pointer}
  .modal-actions .save{background:#0f172a;color:#fff}
  .modal-actions .clear{background:#fde68a}
  .modal-actions .cancel{background:#e5e7eb}
  .modal-actions .delete{background:#fecaca;color:#7f1d1d}
  .modal-actions .xmark{background:#e0f2fe;color:#075985}
  .canvas-wrap{border:2px solid #111;border-radius:8px;background:#fff;touch-action:none}
  .sig-canvas{width:100%;height:240px;display:block;touch-action:none}
  @media(max-width:900px){
    .toolbar-inner{display:grid;grid-template-columns:1fr 1fr}
    .toolbar button{width:100%}
    .wrap{padding:10px 4px 30px}
    .sheet{width:100%;min-height:auto;padding:.15in .08in}
    .sheet-inner,.sheet-actions{min-width:7.55in}
    .union-title{font-size:15px}
    .report-title{grid-template-columns:1fr 1.05in}
    .day-label{font-size:7.8px}
    .sig-canvas{height:220px}
  }
  @media print{
    body{background:#fff}
    .toolbar,.sheet-actions,.edit-btn,.modal,.sig-placeholder{display:none!important}
    .wrap{padding:0}
    .sheet{box-shadow:none;border:0;margin:0;padding:.50in .36in .23in;width:8.5in;min-height:10.95in;overflow:visible}
    .sheet-inner{min-width:0}
    .union-title{font-size:20px}
    .name-grid{grid-template-columns:1fr}
    .sig-box{border:0}
    .hour-btn{cursor:default}
    @page{size:letter portrait;margin:0}
  }
</style>
</head>

let activeSig=null; const sigModal=document.getElementById('sigModal'); const canvas=document.getElementById('sigCanvas'); const ctx=canvas.getContext('2d'); let drawing=false,last=null;

function deepCopy(obj){return JSON.parse(JSON.stringify(obj))}
function loadData(){
  for(const key of storageKeys){
    try{const raw=localStorage.getItem(key); if(raw){return JSON.parse(raw)}}catch(e){}
  }
  return deepCopy(defaultData);
}
function saveRaw(){localStorage.setItem('local806StewardReportV6',JSON.stringify(data));}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function num(v){if(v==null)return 0; if(typeof v==='string' && v.trim().toUpperCase()==='X') return 0; const n=parseFloat(String(v).trim()); return isNaN(n)?0:n}
function fmt(n){return n?(Math.round(n*10)/10).toFixed(1).replace(/\.0$/,''):''}
function hasNumericHours(w){return days.some(d=>{const raw=w[d]; return raw!=='' && raw!=null && !isNaN(parseFloat(String(raw).trim()))})}
function workerTotal(w){return w.crossed?0:days.reduce((t,d)=>t+num(w[d]),0)}
function displayWorkerTotal(w){return hasNumericHours(w)?fmt(workerTotal(w)):''}
function pageTotal(p){return p.workers.reduce((t,w)=>t+workerTotal(w),0)}
function saveData(show){saveRaw(); if(show) alert('Saved on this phone/computer.');}
function setTop(key,val){data[key]=val; saveRaw(); renderFootTotalsOnly();}
function setPageWorker(pi,wi,key,val){if(!data.pages[pi]||!data.pages[pi].workers[wi]) return; data.pages[pi].workers[wi][key]=val; saveRaw(); renderFootTotalsOnly();}
function renderFootTotalsOnly(){
  document.querySelectorAll('[data-page-total]').forEach(el=>{const pi=+el.dataset.pageTotal; el.textContent=fmt(pageTotal(data.pages[pi]));});
  document.querySelectorAll('[data-worker-total]').forEach(el=>{const [pi,wi]=el.dataset.workerTotal.split('-').map(Number); const w=data.pages[pi]?.workers[wi]; el.textContent=w&& !w.crossed ? displayWorkerTotal(w) : '';});
  document.querySelectorAll('[data-hour-display]').forEach(el=>{const [pi,wi,day]=el.dataset.hourDisplay.split('|'); const val=data.pages[+pi]?.workers[+wi]?.[day]||''; el.textContent=val; el.classList.toggle('mark-x', String(val).trim().toUpperCase()==='X');});
}

function render(){
  const app=document.getElementById('app'); app.innerHTML='';
  data.pages.forEach((p,pi)=>{

      '<div class="sheet-actions"><button onclick="addWorker('+pi+')">+ Add worker to page '+p.page+'</button><span class="small-hint">Tap a day box to enter hours or mark an X.</span></div>';
    const tbody=section.querySelector('tbody');
    const minRows=22;
    for(let wi=0; wi<Math.max(minRows,p.workers.length); wi++){
      const w=p.workers[wi]||blankWorker(); const real=!!p.workers[wi];
      const tr=document.createElement('tr'); tr.className='data-row';
      tr.innerHTML='<td class="name-cell">'+(w.role?'<span class="role-tag">'+esc(w.role)+'</span>':'')+'<div class="name-grid"><input class="name-input" value="'+esc(w.name)+'" onchange="setPageWorker('+pi+','+wi+',\'name\',this.value)" '+(real?'':'disabled')+'>'+(real?'<button class="edit-btn" onclick="openWorkerEdit('+pi+','+wi+')">Edit</button>':'<button class="edit-btn blank">Edit</button>')+'</div></td>'+
        '<td><input class="ins-input" value="'+esc(w.ins)+'" onchange="setPageWorker('+pi+','+wi+',\'ins\',this.value)" '+(real?'':'disabled')+'></td>'+
        days.map(d=>{
          if(w.crossed) return '<td><div class="xcell"></div></td>';
          const value=esc(w[d]||'');
          return '<td><button type="button" class="hour-btn '+((String(w[d]||'').trim().toUpperCase()==='X')?'mark-x':'')+'" data-hour-display="'+pi+'|'+wi+'|'+d+'" onclick="openHourEdit('+pi+','+wi+',\''+d+'\')" '+(real?'':'disabled')+'>'+value+'</button></td>';
        }).join('')+
        '<td class="total-cell" data-worker-total="'+pi+'-'+wi+'">'+(w.crossed?'':displayWorkerTotal(w))+'</td>';
      tbody.appendChild(tr);
    }
    app.appendChild(section);
  });
}
function addWorker(pi){data.pages[pi].workers.push(blankWorker()); saveRaw(); render(); setTimeout(()=>{const inputs=document.querySelectorAll('.sheet')[pi].querySelectorAll('.name-input'); inputs[inputs.length-1]?.focus();},50)}
function openWorkerEdit(pi,wi){const w=data.pages[pi].workers[wi]; document.getElementById('editPi').value=pi; document.getElementById('editWi').value=wi; document.getElementById('editName').value=w.name||''; document.getElementById('editIns').value=w.ins||''; document.getElementById('editRole').value=w.role||''; workerModal.classList.add('show'); workerModal.setAttribute('aria-hidden','false');}
function closeWorkerEdit(){workerModal.classList.remove('show'); workerModal.setAttribute('aria-hidden','true');}
function saveWorkerEdit(){const pi=+document.getElementById('editPi').value, wi=+document.getElementById('editWi').value; const w=data.pages[pi].workers[wi]; w.name=document.getElementById('editName').value; w.ins=document.getElementById('editIns').value; w.role=document.getElementById('editRole').value; saveRaw(); closeWorkerEdit(); render();}
function deleteWorkerEdit(){const pi=+document.getElementById('editPi').value, wi=+document.getElementById('editWi').value; const w=data.pages[pi].workers[wi]; if(w.crossed){alert('This crossed-out Wilson/Helen row stays because the union wants it shown on this page. You can edit the name or Ins. No., but it will stay crossed out.'); return;} if(confirm('Delete this worker from this page? The workers below will move up and blank lines will stay at the bottom.')){data.pages[pi].workers.splice(wi,1); saveRaw(); closeWorkerEdit(); render();}}
function openHourEdit(pi,wi,day){const w=data.pages[pi].workers[wi]; document.getElementById('hourPi').value=pi; document.getElementById('hourWi').value=wi; document.getElementById('hourDay').value=day; document.getElementById('hourModalInfo').textContent=(w.name||'Worker')+' - '+day; document.getElementById('hourValue').value=w[day]||''; hourModal.classList.add('show'); hourModal.setAttribute('aria-hidden','false'); setTimeout(()=>document.getElementById('hourValue').focus(),50);}
function closeHourEdit(){hourModal.classList.remove('show'); hourModal.setAttribute('aria-hidden','true');}
function saveHourValue(val){const pi=+document.getElementById('hourPi').value, wi=+document.getElementById('hourWi').value, day=document.getElementById('hourDay').value; let value=(val!==undefined?val:document.getElementById('hourValue').value).trim(); if(value.toUpperCase()==='X') value='X'; setPageWorker(pi,wi,day,value); closeHourEdit();}
function saveHourEdit(){saveHourValue();}
function markHourX(){saveHourValue('X');}
function clearHourEdit(){saveHourValue('');}
function downloadBackup(){saveRaw(); const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='local-806-steward-report-backup.json'; a.click(); URL.revokeObjectURL(a.href);}
function importBackup(e){const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=()=>{try{data=JSON.parse(r.result); saveRaw(); render(); alert('Backup imported.');}catch(err){alert('Could not import this backup.')}}; r.readAsText(file); e.target.value='';}
function resizeCanvas(){const ratio=window.devicePixelRatio||1; const rect=canvas.getBoundingClientRect(); canvas.width=rect.width*ratio; canvas.height=rect.height*ratio; ctx.setTransform(ratio,0,0,ratio,0,0); ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111'; ctx.fillStyle='#fff'; ctx.fillRect(0,0,rect.width,rect.height)}
function pos(e){const r=canvas.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left,y:p.clientY-r.top};}
function startDraw(e){e.preventDefault(); drawing=true; last=pos(e)}
function moveDraw(e){if(!drawing) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p;}
function endDraw(){drawing=false; last=null;}
function clearCanvas(){const r=canvas.getBoundingClientRect(); ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height)}
function openSignature(pi,type){activeSig={pi,type}; document.getElementById('sigTitle').textContent=(type==='employerRep'?'Employer Rep. Signature':'Job Steward Signature')+' - Page '+data.pages[pi].page; sigModal.classList.add('show'); sigModal.setAttribute('aria-hidden','false'); setTimeout(()=>{resizeCanvas(); const src=data.pages[pi].signatures?.[type]; if(src){const img=new Image(); img.onload=()=>{clearCanvas(); ctx.drawImage(img,0,0,canvas.getBoundingClientRect().width,canvas.getBoundingClientRect().height)}; img.src=src;}},40)}
function closeSignature(){sigModal.classList.remove('show'); sigModal.setAttribute('aria-hidden','true'); activeSig=null;}
function saveSignature(){if(!activeSig) return; data.pages[activeSig.pi].signatures=data.pages[activeSig.pi].signatures||{}; data.pages[activeSig.pi].signatures[activeSig.type]=canvas.toDataURL('image/png'); saveRaw(); closeSignature(); render();}
function deleteSignature(){if(!activeSig) return; if(confirm('Delete this saved signature?')){data.pages[activeSig.pi].signatures[activeSig.type]=''; saveRaw(); closeSignature(); render();}}
canvas.addEventListener('mousedown',startDraw); canvas.addEventListener('mousemove',moveDraw); window.addEventListener('mouseup',endDraw); canvas.addEventListener('touchstart',startDraw,{passive:false}); canvas.addEventListener('touchmove',moveDraw,{passive:false}); canvas.addEventListener('touchend',endDraw); window.addEventListener('resize',()=>{if(sigModal.classList.contains('show')) resizeCanvas()});
render();
</script>
