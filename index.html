<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Local 806 Job Steward Weekly Report</title>
<style>
  :root{--ink:#111;--line:#111;--blue:#2084b7;--paper:#fff;--ui:#111827}
  *{box-sizing:border-box}
  html,body{margin:0;background:#e6e7eb;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
  .toolbar{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:10px 12px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
  .toolbar-inner{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .toolbar button{border:0;border-radius:8px;padding:10px 12px;font-size:14px;font-weight:900;cursor:pointer;background:#e5e7eb;color:#111827}
  .toolbar button.primary{background:#38bdf8;color:#06283d}.toolbar button.danger{background:#fecaca;color:#7f1d1d}
  .toolbar .hint{font-size:12px;color:#dbeafe;margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:500px}
  .wrap{padding:22px 10px 44px}
  .sheet{width:8.5in;min-height:11in;margin:0 auto 24px;background:var(--paper);padding:.52in .36in .26in;border:1px solid #999;box-shadow:0 10px 28px rgba(0,0,0,.16);page-break-after:always}
  .sheet-inner{border:2px solid var(--line);background:#fff}
  .union-title{height:.50in;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900;letter-spacing:.1px;border-bottom:1px solid var(--line);white-space:nowrap}
  .report-title{height:.36in;display:grid;grid-template-columns:1fr 1.3in;align-items:center;border-bottom:2px solid var(--line)}
  .report-title .main{text-align:center;font-size:14px;font-weight:900;letter-spacing:.2px}.page-no{text-align:center;font-size:12px}
  table.report{width:100%;border-collapse:collapse;table-layout:fixed;border-bottom:1px solid var(--line)}
  table.report th,table.report td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;vertical-align:middle}
  table.report tr>*:last-child{border-right:0}
  table.report thead th{height:.31in;text-align:center;font-weight:800;font-size:10px;background:#fff;text-transform:uppercase}
  .name-col{width:2.58in}.ins-col{width:.73in}.day-col{width:.55in}.total-col{width:.75in}
  .hours-title{font-size:9px;line-height:1}.day-label{font-size:9px;color:var(--blue);text-transform:none;font-weight:700}
  .data-row td{height:.315in}.name-cell{position:relative;padding:0 3px!important}
  .role-tag{position:absolute;left:4px;top:2px;font-size:5.7px;line-height:1;text-transform:uppercase;color:#4b5563;z-index:1}
  .name-grid{display:grid;grid-template-columns:1fr 34px;align-items:center;gap:2px;width:100%;height:100%;padding-top:6px}
  .name-input,.ins-input,.hour-input{width:100%;border:0;background:transparent;outline:0;font-family:Arial,Helvetica,sans-serif;color:#000;border-radius:0}
  .name-input{font-size:12px;text-align:left;padding:0 2px 0 6px;height:18px;line-height:18px}.ins-input,.hour-input{text-align:center;font-size:12px;height:100%}
  .edit-btn{border:0;background:#e0f2fe;color:#075985;border-radius:4px;padding:2px 4px;font-size:9px;font-weight:800;cursor:pointer}.edit-btn.blank{visibility:hidden}
  .total-cell{background:#f8fafc;text-align:center;font-size:12px;font-weight:800}
  .xcell{position:relative;height:100%;background:#fff}.xcell:before,.xcell:after{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:1.3px solid #555;transform-origin:center}.xcell:before{transform:rotate(35deg)}.xcell:after{transform:rotate(-35deg)}
  .footer{font-size:10px}.foot-line{display:grid;grid-template-columns:1.35in 1fr 1.45in 1.75in;min-height:.31in;border-bottom:1px solid var(--line)}.foot-line:last-child{border-bottom:0}.foot-line>div{border-right:1px solid var(--line);display:flex;align-items:center;padding:3px 5px}.foot-line>div:last-child{border-right:0}
  .foot-label{font-size:9px;color:#333}.foot-input{border:0;background:transparent;width:100%;height:24px;font-size:13px;font-family:Arial,Helvetica,sans-serif;outline:0;padding:0}.foot-value{font-size:13px;font-weight:700;width:100%;text-align:center}.page-total{background:#fffbe6;font-size:14px;font-weight:900;text-align:center;justify-content:center!important}
  .sig-line{min-height:.54in}.sig-box{width:100%;height:.38in;border:1px dashed #777;border-radius:3px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}.sig-box img{max-width:100%;max-height:100%}.sig-placeholder{font-size:8px;color:#666}.sig-caption{font-size:7px;text-align:center;color:#333;line-height:1.1}.sig-wrap{width:100%}
  .fineprint{font-size:6.5px;line-height:1.25;text-align:center;padding:4px 0 5px;color:#222}
  .sheet-actions{display:flex;gap:8px;margin:8px 0 0}.sheet-actions button{border:0;border-radius:7px;background:#dbeafe;padding:8px 10px;font-weight:900;cursor:pointer}.sheet-actions .small-hint{font-size:12px;color:#374151;align-self:center}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.modal-card{width:min(720px,96vw);background:#fff;border-radius:12px;padding:14px;box-shadow:0 14px 44px rgba(0,0,0,.35)}.modal-card h2{margin:0 0 10px;font-size:18px}.modal-card label{display:grid;gap:4px;margin-bottom:8px;font-size:12px;font-weight:800}.modal-card input{border:1px solid #cbd5e1;border-radius:8px;padding:9px;font-size:15px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.modal-actions button{border:0;border-radius:8px;padding:10px 12px;font-weight:900;cursor:pointer}.modal-actions .save{background:#0f172a;color:#fff}.modal-actions .clear{background:#fde68a}.modal-actions .cancel{background:#e5e7eb}.modal-actions .delete{background:#fecaca;color:#7f1d1d}.canvas-wrap{border:2px solid #111;border-radius:8px;background:#fff;touch-action:none}.sig-canvas{width:100%;height:240px;display:block;touch-action:none}
  @media(max-width:900px){.toolbar-inner{display:grid;grid-template-columns:1fr 1fr}.toolbar button{width:100%}.toolbar .hint{grid-column:1/-1;max-width:none}.wrap{padding:10px 4px 30px}.sheet{width:100%;min-height:auto;padding:.15in .08in;overflow-x:auto}.sheet-inner,.sheet-actions{min-width:7.55in}.union-title{font-size:16px}.report-title{grid-template-columns:1fr 1.05in}.day-label{font-size:8px}.sig-canvas{height:220px}}
  @media print{body{background:#fff}.toolbar,.sheet-actions,.edit-btn,.modal,.sig-placeholder{display:none!important}.wrap{padding:0}.sheet{box-shadow:none;border:0;margin:0;padding:.52in .36in .26in;width:8.5in;min-height:10.95in;overflow:visible}.sheet-inner{min-width:0}.union-title{font-size:22px}.name-grid{grid-template-columns:1fr}.name-input,.ins-input,.hour-input,.foot-input{-webkit-appearance:none;appearance:none}.sig-box{border:0}@page{size:letter portrait;margin:0}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="toolbar-inner">
    <button class="primary" onclick="saveData(true)">Save</button>
    <button onclick="window.print()">Print / Save PDF</button>
    <button onclick="downloadBackup()">Download Backup</button>
    <button onclick="document.getElementById('importFile').click()">Import Backup</button>
    <input id="importFile" type="file" accept="application/json" hidden onchange="importBackup(event)">
    <button class="danger" onclick="resetData()">Reset Original List</button>
    <div class="hint">All job info and week ending are inside the union sheet now. Tap/click the Week Ending box in the bottom section to pick the date.</div>
  </div>
</div>
<main id="app" class="wrap"></main>

<div id="sigModal" class="modal" aria-hidden="true"><div class="modal-card"><h2 id="sigTitle">Sign</h2><div class="canvas-wrap"><canvas id="sigCanvas" class="sig-canvas"></canvas></div><div class="modal-actions"><button class="save" onclick="saveSignature()">Save Signature</button><button class="clear" onclick="clearCanvas()">Clear</button><button class="delete" onclick="deleteSignature()">Delete Saved Signature</button><button class="cancel" onclick="closeSignature()">Cancel</button></div></div></div>
<div id="workerModal" class="modal" aria-hidden="true"><div class="modal-card"><h2>Edit Worker</h2><input type="hidden" id="editPi"><input type="hidden" id="editWi"><label>Name<input id="editName" type="text"></label><label>Ins. No.<input id="editIns" type="text"></label><label>Role / note, optional<input id="editRole" type="text" placeholder="FOREMAN or SHOP STEWARD"></label><div class="modal-actions"><button class="save" onclick="saveWorkerEdit()">Save Worker</button><button class="delete" onclick="deleteWorkerEdit()">Delete Worker From This Page</button><button class="cancel" onclick="closeWorkerEdit()">Cancel</button></div></div></div>
<script>
const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const blankWorker=()=>({name:'',ins:''});
const defaultData={employer:'Jagd Construction',location:'Dyre Ave Bronx',generalContractor:'Judlaw Contracting',contractNumber:'C-35311',weekEnding:'',pages:[
{page:1,total:3,signatures:{employerRep:'',jobSteward:''},workers:[{role:'FOREMAN',name:'Wilson Monteiro',ins:'11847'},{role:'SHOP STEWARD',name:'Helen Betances',ins:'20835'},{name:'Estefano Horning',ins:'11612'},{name:'Ruben Vasquez',ins:'11126'},{name:'Alison Dos Santos',ins:'20956'},{name:'Jefferson Domaleski',ins:'20338'},{name:'Joel Melgar',ins:'21139'},{name:'Maccin Polet Jr',ins:'21050'},{name:'Felix Gonzalez',ins:'21336'},{name:'Geanderson Campos',ins:'21167'},{name:'Tyler Saradene',ins:'21415'},{name:'Robert Young',ins:'DC21'},{name:'Jima Horning',ins:'21440'},{name:'Henry Melgar',ins:'21199'},{name:'Juan Castelhano',ins:'21333'},{name:'Marcos Diaz',ins:'21031'},{name:'Rivaldo Dos Santos',ins:'21060'},{name:'Victoria Veloso',ins:'21449'},{name:'Albin Cardona',ins:'DC51'},{name:'Timothy Ladd',ins:'20588'},{name:'Ismael Brasilino',ins:'20864'}]},
{page:2,total:3,signatures:{employerRep:'',jobSteward:''},workers:[{role:'FOREMAN',name:'Wilson Monteiro',ins:'11847',crossed:true},{role:'SHOP STEWARD',name:'Helen Betances',ins:'20835',crossed:true},{name:'Fabiano Rodrigues',ins:'21078'},{name:'Rafael De Castro',ins:'21007'},{name:'Mayron Sales',ins:'DC21'},{name:'Dicesar Miranda',ins:'11735'},{name:'Alex Mikelen Miranda',ins:'21334'},{name:'Deyvid De Oliveira',ins:'21244'},{name:'Gustavo Pereira',ins:'20153'},{name:'Roman Amparo',ins:'21770'},{name:'Oscar Marge',ins:'DC51'},{name:'Carlos Lopez',ins:'DC51'},{name:'Yonig Cruz',ins:'DC51'},{name:'Moises Sotta',ins:'DC51'},{name:'Jared Arista',ins:'21416'},{name:'Anthony Lovich',ins:'11175'},{name:'Anderson Ceranto',ins:'11804'},{name:'Chiver Pereira',ins:'20817'},{name:'Romel Guzhnay',ins:'21214'},{name:'Elber Flores',ins:'DC21'},{name:'Marcos Costa',ins:'DC21'}]},
{page:3,total:3,signatures:{employerRep:'',jobSteward:''},workers:[{role:'FOREMAN',name:'Wilson Monteiro',ins:'11847',crossed:true},{role:'SHOP STEWARD',name:'Helen Betances',ins:'20835',crossed:true},{name:'Jorge Santiago',ins:'11779'},{name:'Emerson E Haile',ins:'21335'},{name:'Gabriel De Almeida',ins:'DC21'},{name:'Raymond Roaett',ins:'20431'},{name:'Beau Forget',ins:'20553'},{name:'Stephen Tillman',ins:'DC91'},{name:'Antonio Silvzalo',ins:'DC21'}]}]};
let data=loadData();let activeSig=null;let drawing=false;let last=null;const sigModal=document.getElementById('sigModal');const workerModal=document.getElementById('workerModal');const canvas=document.getElementById('sigCanvas');const ctx=canvas.getContext('2d');
function loadData(){try{let raw=localStorage.getItem('local806StewardReportV4')||localStorage.getItem('local806StewardReportV3');if(!raw)return JSON.parse(JSON.stringify(defaultData));let d=JSON.parse(raw);d.pages.forEach((p,i)=>{p.signatures=p.signatures||{employerRep:'',jobSteward:''};if(i>0&&p.workers[0])p.workers[0].crossed=true;if(i>0&&p.workers[1])p.workers[1].crossed=true});return d}catch(e){return JSON.parse(JSON.stringify(defaultData))}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function num(v){const n=parseFloat(v);return isNaN(n)?0:n}function fmt(n){return n?(Math.round(n*10)/10).toFixed(1).replace(/\.0$/,''):''}function workerTotal(w){return w.crossed?0:days.reduce((t,d)=>t+num(w[d]),0)}function pageTotal(p){return p.workers.reduce((t,w)=>t+workerTotal(w),0)}
function saveData(show){localStorage.setItem('local806StewardReportV4',JSON.stringify(data));if(show)alert('Saved on this phone/computer.')}function setTop(key,val){data[key]=val;saveData(false);renderFootTotalsOnly()}function setPageWorker(pi,wi,key,val){data.pages[pi].workers[wi][key]=val;saveData(false);renderFootTotalsOnly()}function renderFootTotalsOnly(){document.querySelectorAll('[data-page-total]').forEach(el=>{const pi=+el.dataset.pageTotal;el.textContent=fmt(pageTotal(data.pages[pi]));});document.querySelectorAll('[data-worker-total]').forEach(el=>{const [pi,wi]=el.dataset.workerTotal.split('-').map(Number);el.textContent=data.pages[pi].workers[wi]?.crossed?'':fmt(workerTotal(data.pages[pi].workers[wi]));});}
function sigHtml(pi,type){const src=data.pages[pi].signatures?.[type]||'';return `<div class="sig-wrap"><div class="sig-box" onclick="openSignature(${pi},'${type}')">${src?`<img src="${src}" alt="signature">`:`<span class="sig-placeholder">Tap/click to sign</span>`}</div><div class="sig-caption">${type==='employerRep'?'Employer Rep.':'Job Steward'}</div></div>`}
function render(){const app=document.getElementById('app');app.innerHTML='';data.pages.forEach((p,pi)=>{const section=document.createElement('section');section.className='sheet';section.innerHTML=`<div class="sheet-inner"><div class="union-title">Structural Steel Painters of Greater New York, Local Union 806</div><div class="report-title"><div class="main">JOB STEWARD'S WEEKLY REPORT</div><div class="page-no">Page <u>${p.page}</u> of <u>${p.total}</u></div></div><table class="report"><colgroup><col class="name-col"><col class="ins-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="day-col"><col class="total-col"></colgroup><thead><tr><th rowspan="2">NAME OF MEMBERS</th><th rowspan="2">Ins.<br>No.</th><th colspan="7" class="hours-title">HOURS WORKED ONLY</th><th rowspan="2">TOTAL<br>TIME</th></tr><tr>${days.map(d=>`<th><span class="day-label">${d}</span></th>`).join('')}</tr></thead><tbody></tbody></table><div class="footer"><div class="foot-line"><div class="foot-label">Employer's Name:</div><div><input class="foot-input" value="${esc(data.employer)}" onchange="setTop('employer',this.value)"></div><div class="foot-label">Week Ending:</div><div><input class="foot-input" type="date" value="${esc(data.weekEnding)}" onchange="setTop('weekEnding',this.value)"></div></div><div class="foot-line"><div class="foot-label">Location of Job:</div><div><input class="foot-input" value="${esc(data.location)}" onchange="setTop('location',this.value)"></div><div class="foot-label">Total Hours This Page:</div><div class="page-total" data-page-total="${pi}">${fmt(pageTotal(p))}</div></div><div class="foot-line"><div class="foot-label">General Contractor:</div><div><input class="foot-input" value="${esc(data.generalContractor)}" onchange="setTop('generalContractor',this.value)"></div><div class="foot-label">Contract Number:</div><div><input class="foot-input" value="${esc(data.contractNumber)}" onchange="setTop('contractNumber',this.value)"></div></div><div class="foot-line sig-line"><div class="foot-label">Signed</div><div>${sigHtml(pi,'employerRep')}</div><div class="foot-label">Signed</div><div>${sigHtml(pi,'jobSteward')}</div></div><div class="fineprint">Men are required to fill in the correct amount of hours worked each day.<br>Stewards will be held responsible for the correctness of this report.<br>Report all accidents to your Business Agent immediately.</div></div></div><div class="sheet-actions"><button onclick="addWorker(${pi})">+ Add worker to page ${p.page}</button><span class="small-hint">Use Edit beside a name to change or delete that worker.</span></div>`;const tbody=section.querySelector('tbody');const minRows=22;for(let wi=0;wi<Math.max(minRows,p.workers.length);wi++){const w=p.workers[wi]||blankWorker();const real=!!p.workers[wi];const tr=document.createElement('tr');tr.className='data-row';tr.innerHTML=`<td class="name-cell">${w.role?`<span class="role-tag">${esc(w.role)}</span>`:''}<div class="name-grid"><input class="name-input" value="${esc(w.name)}" onchange="setPageWorker(${pi},${wi},'name',this.value)" ${real?'':'disabled'}>${real?`<button class="edit-btn" onclick="openWorkerEdit(${pi},${wi})">Edit</button>`:`<button class="edit-btn blank">Edit</button>`}</div></td><td><input class="ins-input" value="${esc(w.ins)}" onchange="setPageWorker(${pi},${wi},'ins',this.value)" ${real?'':'disabled'}></td>${days.map(d=>w.crossed?`<td><div class="xcell"></div></td>`:`<td><input class="hour-input" inputmode="decimal" value="${esc(w[d]||'')}" oninput="setPageWorker(${pi},${wi},'${d}',this.value)" ${real?'':'disabled'}></td>`).join('')}<td class="total-cell" data-worker-total="${pi}-${wi}">${w.crossed?'':fmt(workerTotal(w))}</td>`;tbody.appendChild(tr)}app.appendChild(section)});}
function addWorker(pi){data.pages[pi].workers.push(blankWorker());saveData(false);render();setTimeout(()=>{const inputs=document.querySelectorAll('.sheet')[pi].querySelectorAll('.name-input');inputs[inputs.length-1]?.focus()},50)}
function openWorkerEdit(pi,wi){const w=data.pages[pi].workers[wi];document.getElementById('editPi').value=pi;document.getElementById('editWi').value=wi;document.getElementById('editName').value=w.name||'';document.getElementById('editIns').value=w.ins||'';document.getElementById('editRole').value=w.role||'';workerModal.classList.add('show');workerModal.setAttribute('aria-hidden','false');}
function closeWorkerEdit(){workerModal.classList.remove('show');workerModal.setAttribute('aria-hidden','true');}
function saveWorkerEdit(){const pi=+document.getElementById('editPi').value,wi=+document.getElementById('editWi').value;const w=data.pages[pi].workers[wi];w.name=document.getElementById('editName').value;w.ins=document.getElementById('editIns').value;w.role=document.getElementById('editRole').value;saveData(false);closeWorkerEdit();render();}
function deleteWorkerEdit(){const pi=+document.getElementById('editPi').value,wi=+document.getElementById('editWi').value;const w=data.pages[pi].workers[wi];if(w.crossed){alert('This crossed-out Wilson/Helen row stays because the union wants it shown on this page. You can edit the name or Ins. No., but it will stay crossed out.');return}if(confirm('Delete this worker from this page? The workers below will move up and blank lines will stay at the bottom.')){data.pages[pi].workers.splice(wi,1);saveData(false);closeWorkerEdit();render();}}
function resetData(){if(confirm('Reset back to the original 3-page list and clear hours/signatures?')){localStorage.removeItem('local806StewardReportV4');localStorage.removeItem('local806StewardReportV3');data=JSON.parse(JSON.stringify(defaultData));render();}}
function downloadBackup(){saveData(false);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='local-806-steward-report-backup.json';a.click();URL.revokeObjectURL(a.href)}function importBackup(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);saveData(false);render();alert('Backup imported.')}catch(err){alert('Could not import this backup.')}};r.readAsText(file);e.target.value=''}
function resizeCanvas(){const ratio=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=rect.width*ratio;canvas.height=rect.height*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.fillStyle='#fff';ctx.fillRect(0,0,rect.width,rect.height)}function pos(e){const r=canvas.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}function startDraw(e){e.preventDefault();drawing=true;last=pos(e)}function moveDraw(e){if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}function endDraw(){drawing=false;last=null}function clearCanvas(){const r=canvas.getBoundingClientRect();ctx.fillStyle='#fff';ctx.fillRect(0,0,r.width,r.height)}
function openSignature(pi,type){activeSig={pi,type};document.getElementById('sigTitle').textContent=(type==='employerRep'?'Employer Rep. Signature':'Job Steward Signature')+' - Page '+data.pages[pi].page;sigModal.classList.add('show');sigModal.setAttribute('aria-hidden','false');setTimeout(()=>{resizeCanvas();const src=data.pages[pi].signatures?.[type];if(src){const img=new Image();img.onload=()=>{clearCanvas();ctx.drawImage(img,0,0,canvas.getBoundingClientRect().width,canvas.getBoundingClientRect().height)};img.src=src}},40)}function closeSignature(){sigModal.classList.remove('show');sigModal.setAttribute('aria-hidden','true');activeSig=null}function saveSignature(){if(!activeSig)return;data.pages[activeSig.pi].signatures=data.pages[activeSig.pi].signatures||{};data.pages[activeSig.pi].signatures[activeSig.type]=canvas.toDataURL('image/png');saveData(false);closeSignature();render()}function deleteSignature(){if(!activeSig)return;if(confirm('Delete this saved signature?')){data.pages[activeSig.pi].signatures[activeSig.type]='';saveData(false);closeSignature();render()}}
canvas.addEventListener('mousedown',startDraw);canvas.addEventListener('mousemove',moveDraw);window.addEventListener('mouseup',endDraw);canvas.addEventListener('touchstart',startDraw,{passive:false});canvas.addEventListener('touchmove',moveDraw,{passive:false});canvas.addEventListener('touchend',endDraw);window.addEventListener('resize',()=>{if(sigModal.classList.contains('show'))resizeCanvas()});render();
</script>
</body>
</html>
