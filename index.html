<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temporarily Unavailable</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0f172a;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .card{
    width:min(720px,96vw);
    border:4px solid #fff;
    border-radius:24px;
    padding:42px 26px;
    background:linear-gradient(180deg,#111827,#020617);
    box-shadow:0 22px 70px rgba(0,0,0,.45);
  }
  h1{
    margin:0 0 18px;
    font-size:clamp(34px,7vw,64px);
    line-height:1.02;
    font-weight:1000;
    letter-spacing:.5px;
    text-transform:uppercase;
  }
  p{
    margin:0;
    font-size:clamp(18px,3.8vw,28px);
    line-height:1.35;
    font-weight:800;
    color:#e5e7eb;
  }
  .small{
    margin-top:26px;
    font-size:clamp(14px,2.6vw,18px);
    color:#94a3b8;
    font-weight:700;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>Profile Temporarily Unavailable</h1>
    <p>This profile is temporarily unavailable due to maintenance.</p>
    <div class="small">Please check back later.</div>
  </main>
</body>
</html>
